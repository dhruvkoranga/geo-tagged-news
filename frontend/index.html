<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTaggedNews</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>GeoTaggedNews</h1>
        <div class="form-container">
            <input type="text" id="keyword-input" placeholder="Enter keyword">
            <button id="add-keyword-btn">Add Keyword</button>
        </div>
        <div class="keywords-container">
            <h2>Active Keywords</h2>
            <ul id="keywords-list"></ul>
        </div>
        <div class="form-container">
            <input type="text" id="location-input" placeholder="Enter location">
            <button id="search-articles-btn">Search Articles</button>
        </div>
        <div class="articles-container">
            <h2>Articles</h2>
            <ul id="articles-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
